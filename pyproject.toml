[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-center-wsi-generator"
version = "0.60.0"
description = "Local H&E WSI generator core utilities and schema contracts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
embeddings = ["numpy>=1.24"]
outputs = [
  "numpy>=1.24",
  "tifffile>=2024.8",
]
training = [
  "numpy>=1.24",
  "Pillow>=9.0",
]
torch = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "torch>=2.5",
]
ui = ["PySide6>=6.7"]
yaml = ["PyYAML>=6.0"]
wsi = [
  "numpy>=1.24",
  "openslide-python>=1.3",
  "Pillow>=9.0",
]

[project.scripts]
he-wsi-gen = "he_wsi_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
